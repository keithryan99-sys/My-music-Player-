
name: Build My Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get app source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check manifest file
        run: |
          echo "Manifest path:"
          ls -la app/src/main/
          echo "Manifest contents:"
          cat -n app/src/main/AndroidManifest.xml
          echo "XML validation:"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML is valid')"

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
